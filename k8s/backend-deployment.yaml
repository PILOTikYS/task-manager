apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/pilotikys/task-backend:latest
        env:
        - name: DATABASE_URL
          value: "postgresql://taskuser:supersecretpassword@db:5432/taskdb"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        ports:
        - containerPort: 5000
