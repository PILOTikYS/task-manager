apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: {{ .Values.frontend.image }}
        command: ["nginx", "-g", "daemon off;"]   # <--- Добавили эту строку
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf  # <--- Указываем файл, а не папку
          subPath: default.conf                      # <--- Добавляем subPath
      volumes:                        # <--- Добавили
      - name: nginx-config
        configMap:
          name: frontend-config
